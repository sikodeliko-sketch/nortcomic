<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NortComic — En construcción</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Barlow+Condensed:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --rojo:#cf2027;
  --rojo-claro:#e5353c;
  --amarillo:#f5c518;
  --negro:#0a0a0c;
  --gris:#1a1a1f;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--negro);
  color:#fff;
  font-family:'Barlow Condensed',system-ui,sans-serif;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* ---------- fondo ---------- */
.fondo{position:fixed;inset:0;overflow:hidden;z-index:0}
.fondo::before{
  content:'';position:absolute;inset:-20%;
  background:radial-gradient(circle at 50% 55%, rgba(207,32,39,.35) 0%, rgba(207,32,39,.10) 32%, transparent 62%);
  animation:latido 5s ease-in-out infinite;
}
.fondo::after{
  content:'';position:absolute;inset:0;
  background-image:radial-gradient(rgba(255,255,255,.10) 1px, transparent 1.4px);
  background-size:7px 7px;
  opacity:.25;
  mask-image:radial-gradient(circle at 50% 55%, #000 10%, transparent 72%);
  -webkit-mask-image:radial-gradient(circle at 50% 55%, #000 10%, transparent 72%);
}
@keyframes latido{0%,100%{opacity:.85;transform:scale(1)}50%{opacity:1;transform:scale(1.05)}}

/* rayos de velocidad estilo comic */
.rayos{position:absolute;inset:0;animation:girarLento 90s linear infinite;opacity:.18}
.rayos span{
  position:absolute;left:50%;top:55%;
  width:50vmax;height:2px;transform-origin:0 50%;
  background:linear-gradient(90deg, transparent, rgba(245,197,24,.9) 65%, transparent);
}
@keyframes girarLento{to{transform:rotate(360deg)}}

#chispas{position:fixed;inset:0;z-index:3;pointer-events:none}

/* ---------- escena ---------- */
.escena{
  position:relative;z-index:2;
  width:min(1100px,94vw);
  display:flex;flex-direction:column;align-items:center;
  gap:clamp(6px,1.4vh,18px);
  padding:2vh 0;
}

.logo{
  width:clamp(110px,13vw,170px);
  filter:drop-shadow(0 0 18px rgba(207,32,39,.75));
  animation:flotar 4s ease-in-out infinite;
}
@keyframes flotar{0%,100%{transform:translateY(0) rotate(-1.2deg)}50%{transform:translateY(-12px) rotate(1.2deg)}}

.taller{
  position:relative;
  width:100%;
  display:flex;align-items:flex-end;justify-content:center;
  gap:clamp(10px,4vw,70px);
  height:clamp(290px,46vh,430px);
}

/* ---------- personaje ---------- */
.mago{
  position:relative;
  height:100%;
  flex:0 0 auto;
  animation:entrarMago 1.2s cubic-bezier(.2,.9,.3,1.3) both, respirar 3.4s 1.2s ease-in-out infinite;
}
.mago img{
  height:100%;width:auto;display:block;
  filter:drop-shadow(0 18px 24px rgba(0,0,0,.65)) drop-shadow(0 0 26px rgba(245,197,24,.28));
}
@keyframes entrarMago{from{opacity:0;transform:translateY(60px) scale(.85)}to{opacity:1;transform:none}}
@keyframes respirar{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

/* mandalas de magia en las manos */
.mandala{
  position:absolute;width:30%;aspect-ratio:1;
  left:var(--x);top:var(--y);transform:translate(-50%,-50%);
  animation:aparecerRunas 2.6s ease-in-out infinite;
}
.mandala.izq{--x:17%;--y:62%}
.mandala.der{--x:84%;--y:61%}
.mandala.der{animation-delay:.35s}
.mandala svg{width:100%;height:100%;overflow:visible}
.aro{fill:none;stroke:var(--amarillo);stroke-width:2.2;filter:drop-shadow(0 0 6px rgba(245,197,24,.95))}
.aro.r2{stroke:var(--rojo-claro);stroke-width:1.6;filter:drop-shadow(0 0 6px rgba(229,53,60,.9))}
.gira-h{animation:girarH 6s linear infinite;transform-origin:50% 50%}
.gira-a{animation:girarA 9s linear infinite;transform-origin:50% 50%}
@keyframes girarH{to{transform:rotate(360deg)}}
@keyframes girarA{to{transform:rotate(-360deg)}}
@keyframes aparecerRunas{0%,100%{opacity:.25;transform:translate(-50%,-50%) scale(.75)}
  45%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}}

/* haz de magia hacia la web */
.haz{
  position:absolute;right:-6%;top:52%;
  width:26%;height:5px;transform:translateY(-50%) rotate(-8deg);
  background:linear-gradient(90deg, rgba(245,197,24,0), rgba(245,197,24,.95), rgba(229,53,60,.9));
  filter:blur(1.5px);
  animation:haz 2.6s ease-in-out infinite;
}
@keyframes haz{0%,100%{opacity:0;transform:translateY(-50%) rotate(-8deg) scaleX(.2)}
  40%{opacity:1;transform:translateY(-50%) rotate(-8deg) scaleX(1)}
  70%{opacity:.6}}

/* ---------- la web que se construye ---------- */
.pantalla{
  position:relative;
  width:clamp(240px,34vw,400px);
  aspect-ratio:4/3;
  background:linear-gradient(160deg, rgba(26,26,31,.95), rgba(10,10,12,.95));
  border:2px solid rgba(245,197,24,.75);
  border-radius:12px;
  box-shadow:0 0 30px rgba(245,197,24,.35), inset 0 0 40px rgba(207,32,39,.18);
  overflow:hidden;
  animation:materializar 7s ease-in-out infinite;
  margin-bottom:4%;
}
@keyframes materializar{
  0%{opacity:0;transform:translateY(18px) scale(.9) rotateY(18deg);filter:blur(6px)}
  14%{opacity:1;transform:none;filter:blur(0)}
  88%{opacity:1;transform:none;filter:blur(0)}
  100%{opacity:0;transform:translateY(18px) scale(.9) rotateY(18deg);filter:blur(6px)}
}
.barra{
  height:26px;background:rgba(255,255,255,.07);
  border-bottom:1px solid rgba(245,197,24,.35);
  display:flex;align-items:center;gap:6px;padding:0 10px;
}
.punto{width:9px;height:9px;border-radius:50%;background:var(--rojo)}
.punto:nth-child(2){background:var(--amarillo)}
.punto:nth-child(3){background:#5a5a62}
.url{
  margin-left:8px;height:11px;flex:1;border-radius:6px;
  background:rgba(255,255,255,.12);
  animation:crecer 7s ease-in-out infinite;animation-delay:.5s;
}
.cuerpo{padding:14px;display:grid;gap:10px}
.bloque{height:14px;border-radius:5px;background:rgba(255,255,255,.14);transform-origin:left;animation:crecer 7s ease-in-out infinite}
.bloque.titulo{height:24px;width:62%;background:linear-gradient(90deg,var(--rojo),var(--amarillo));animation-delay:.9s}
.bloque.l1{animation-delay:1.3s}
.bloque.l2{width:85%;animation-delay:1.6s}
.bloque.l3{width:70%;animation-delay:1.9s}
.fila{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.carta{height:46px;border-radius:7px;background:rgba(245,197,24,.18);border:1px solid rgba(245,197,24,.4);transform-origin:center;animation:popear 7s ease-in-out infinite}
.carta:nth-child(2){animation-delay:2.5s}
.carta:nth-child(3){animation-delay:2.8s}
.carta:nth-child(1){animation-delay:2.2s}
@keyframes crecer{0%,8%{transform:scaleX(0);opacity:0}16%,92%{transform:scaleX(1);opacity:1}100%{opacity:0}}
@keyframes popear{0%,20%{transform:scale(0);opacity:0}28%,92%{transform:scale(1);opacity:1}100%{opacity:0}}

.destello{
  position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.35) 50%,transparent 65%);
  transform:translateX(-120%);
  animation:brillo 7s ease-in-out infinite;
}
@keyframes brillo{0%,10%{transform:translateX(-120%)}30%{transform:translateX(120%)}100%{transform:translateX(120%)}}

/* ---------- leyenda ---------- */
.leyenda{text-align:center;margin-top:clamp(2px,1vh,10px)}
.cartel{
  font-family:'Bangers',cursive;
  font-size:clamp(34px,6.4vw,76px);
  letter-spacing:3px;
  color:var(--amarillo);
  -webkit-text-stroke:2px #000;
  text-shadow:0 4px 0 var(--rojo), 0 7px 16px rgba(0,0,0,.8);
  animation:temblor 3.5s ease-in-out infinite;
}
@keyframes temblor{0%,100%{transform:rotate(-1.5deg) scale(1)}50%{transform:rotate(1.5deg) scale(1.03)}}
.sub{
  margin-top:6px;font-size:clamp(13px,1.5vw,19px);
  letter-spacing:5px;text-transform:uppercase;color:#cfcfd6;
}
.progreso{
  margin:14px auto 0;width:min(340px,70vw);height:9px;border-radius:99px;
  background:rgba(255,255,255,.12);overflow:hidden;
}
.progreso i{
  display:block;height:100%;width:40%;border-radius:99px;
  background:linear-gradient(90deg,var(--rojo),var(--amarillo));
  animation:cargar 2.6s ease-in-out infinite;
}
@keyframes cargar{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}

@media (max-width:760px){
  .taller{flex-direction:column;align-items:center;height:auto;gap:18px}
  .mago{height:clamp(200px,34vh,280px)}
  .pantalla{width:min(86vw,340px);margin-bottom:0}
  .haz{display:none}
}
</style>
</head>
<body>

<div class="fondo"><div class="rayos" id="rayos"></div></div>
<canvas id="chispas"></canvas>

<main class="escena">
  <img class="logo" src="img/logo.png" alt="NortComic">

  <section class="taller">
    <div class="mago">
      <img src="img/personaje.png" alt="Mago NortComic">

      <div class="mandala izq">
        <svg viewBox="0 0 100 100">
          <g class="gira-h">
            <circle class="aro" cx="50" cy="50" r="40" stroke-dasharray="10 7"/>
            <circle class="aro r2" cx="50" cy="50" r="31" stroke-dasharray="3 9"/>
          </g>
          <g class="gira-a">
            <circle class="aro" cx="50" cy="50" r="22" stroke-dasharray="16 10"/>
            <path class="aro r2" d="M50 36 L62 57 L38 57 Z"/>
          </g>
        </svg>
      </div>

      <div class="mandala der">
        <svg viewBox="0 0 100 100">
          <g class="gira-a">
            <circle class="aro" cx="50" cy="50" r="40" stroke-dasharray="14 9"/>
            <circle class="aro r2" cx="50" cy="50" r="33" stroke-dasharray="4 6"/>
          </g>
          <g class="gira-h">
            <circle class="aro" cx="50" cy="50" r="21" stroke-dasharray="12 8"/>
            <path class="aro r2" d="M36 44 L64 44 L50 66 Z"/>
          </g>
        </svg>
      </div>

      <div class="haz"></div>
    </div>

    <div class="pantalla">
      <div class="barra">
        <span class="punto"></span><span class="punto"></span><span class="punto"></span>
        <span class="url"></span>
      </div>
      <div class="cuerpo">
        <div class="bloque titulo"></div>
        <div class="bloque l1"></div>
        <div class="bloque l2"></div>
        <div class="bloque l3"></div>
        <div class="fila">
          <div class="carta"></div><div class="carta"></div><div class="carta"></div>
        </div>
      </div>
      <div class="destello"></div>
    </div>
  </section>

  <div class="leyenda">
    <div class="cartel">EN CONSTRUCCIÓN</div>
    <div class="sub">Estamos conjurando algo grande</div>
    <div class="progreso"><i></i></div>
  </div>
</main>

<script>
/* rayos de fondo */
const rayos = document.getElementById('rayos');
for (let i = 0; i < 26; i++) {
  const s = document.createElement('span');
  s.style.transform = `rotate(${i * (360 / 26)}deg)`;
  rayos.appendChild(s);
}

/* chispas mágicas */
const cv = document.getElementById('chispas');
const ctx = cv.getContext('2d');
let W, H, origenes = [];

function medir() {
  W = cv.width = innerWidth;
  H = cv.height = innerHeight;
  origenes = [...document.querySelectorAll('.mandala')].map(m => {
    const r = m.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  });
}
addEventListener('resize', medir);

const colores = ['#f5c518', '#e5353c', '#ffe580', '#ffffff'];
const chispas = [];

function nacer() {
  if (!origenes.length) return;
  const o = origenes[Math.random() < .5 ? 0 : (origenes.length - 1)];
  const ang = -Math.PI / 2 + (Math.random() - .5) * 2.4;
  const vel = .5 + Math.random() * 1.9;
  chispas.push({
    x: o.x + (Math.random() - .5) * 26,
    y: o.y + (Math.random() - .5) * 26,
    vx: Math.cos(ang) * vel,
    vy: Math.sin(ang) * vel,
    r: 1 + Math.random() * 2.6,
    vida: 1,
    dec: .006 + Math.random() * .012,
    c: colores[(Math.random() * colores.length) | 0]
  });
}

function animar() {
  ctx.clearRect(0, 0, W, H);
  for (let i = 0; i < 3; i++) nacer();
  for (let i = chispas.length - 1; i >= 0; i--) {
    const p = chispas[i];
    p.x += p.vx; p.y += p.vy;
    p.vy -= .012;           // la magia sube
    p.vida -= p.dec;
    if (p.vida <= 0) { chispas.splice(i, 1); continue; }
    ctx.globalAlpha = Math.max(p.vida, 0);
    ctx.fillStyle = p.c;
    ctx.shadowBlur = 12;
    ctx.shadowColor = p.c;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * p.vida, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  requestAnimationFrame(animar);
}

medir();
setInterval(medir, 1200); // sigue a las manos aunque el personaje respire
animar();
</script>
</body>
</html>
